name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' --no-build-isolation
        env:
          DANDAN_BUILD_CUDA: '0'
      - name: Test CPU contracts and fallbacks
        run: python -m pytest -q
      - name: Check benchmark module entry points
        run: |
          python -m benchmarks.bench_qwen3_gemm --help
          python -m benchmarks.bench_flash_inference --help
          python -m benchmarks.bench_attention_layouts --help
          python -m benchmarks.bench_decode_buffers --help
          python -m benchmarks.bench_elementwise --help
